name: Update latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://arjunprabhulal.com/feed.xml,https://medium.com/feed/@arjun-prabhulal"
          max_post_count: 5
          # Drop tracking parameters, and skip Medium copies of posts first published on arjunprabhulal.com
          item_exec: |
            post.url = post.url.split('?')[0];
            const body = item['content:encoded'] || item.content || '';
            if (post.url.includes('medium.com') && body.includes('Originally published at </em><a href="https://arjunprabhulal.com')) { post = null; }
